version: 2

# Weekly updates for npm packages and for the GitHub Actions the workflows use,
# opened against develop so they ship with the next normal release. Minor and
# patch bumps arrive as one grouped PR per ecosystem; each major bump gets its
# own PR so a breaking upgrade doesn't block the rest. Major action releases
# are how actions move to a newer Node runtime, so leaving them unmerged brings
# back GitHub's deprecation warnings.
#
# Urgent security fixes are not configured here: a Dependabot rule in the repo
# settings opens PRs only for critical alerts in runtime dependencies. Those go
# to master, where they fail version-check until a release is cut, which is
# intended: a fix only reaches users through a new version.
#
# Dependabot reads this file from the default branch (master), so changes take
# effect after the next release.
updates:
    - package-ecosystem: npm
      directory: /
      target-branch: develop
      schedule:
          interval: weekly
      groups:
          # vitest and its plugins (@vitest/coverage-v8) must share a version,
          # so they move together, majors included. Listed first because an
          # update joins the first group it matches.
          vitest:
              patterns: ['vitest', '@vitest/*']
          minor-and-patch:
              update-types: [minor, patch]
      ignore:
          # TypeDoc doesn't support TypeScript 7 yet, so npm can't install it
          # alongside the docs build. Remove once TypeDoc lists 7 in its
          # peerDependencies; tracked in #23, waiting on
          # https://github.com/TypeStrong/typedoc/issues/3098
          - dependency-name: typescript
            versions: ['>=7']
    - package-ecosystem: github-actions
      directory: /
      target-branch: develop
      schedule:
          interval: weekly
      groups:
          minor-and-patch:
              update-types: [minor, patch]
